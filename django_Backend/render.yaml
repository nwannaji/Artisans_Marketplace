# ── Render Blueprint ────────────────────────────────────────
# Deploy instructions:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com → New → Blueprint
#   3. Connect your GitHub repo
#   4. Render reads this file and creates both services
#   5. Set SECRET_KEY & other secrets in the Render dashboard (Env Groups)
# ────────────────────────────────────────────────────────────

services:
  # ── Web API ─────────────────────────────────────────────
  - type: web
    name: fixit-api
    runtime: docker
    plan: free                       # Change to 'starter' for $7/mo (no cold starts)
    region: oregon                   # or frankfurt for EU
    branch: artisans_services
    rootDir: django_Backend          # Subdirectory in the repo
    dockerfilePath: ./Dockerfile
    # Render auto-assigns PORT; gunicorn reads it via the CMD in Dockerfile
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "fixit-api-lsyh.onrender.com,fixit-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://fixit.onrender.com"
      # ── Email / SMTP (for password reset OTPs) ──
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_TIMEOUT
        value: "30"
      # ── Secrets (set manually in Render Dashboard → Env) ──
      # SECRET_KEY            → generate: python -c "import secrets; print(secrets.token_urlsafe(50))"
      # DATABASE_URL          → from Neon: postgresql://neondb_owner:password@ep-xxx.neon.tech/neondb?sslmode=require
      # EMAIL_HOST_USER       → your Gmail address (e.g. kaycollinservices@gmail.com)
      # EMAIL_HOST_PASSWORD   → your Gmail app password (https://myaccount.google.com/apppasswords)
      # DEFAULT_FROM_EMAIL    → sender address for outgoing emails (e.g. kaycollinservices@gmail.com)
      # PAYSTACK_SECRET_KEY, PAYSTACK_PUBLIC_KEY
      # PANDASCROW_CLIENT_ID, PANDASCROW_CLIENT_SECRET, PANDASCROW_WEBHOOK_SECRET
      # SMS_USERNAME, SMS_API_KEY, SMS_SENDER_NAME
      # GOOGLE_MAPS_API_KEY

databases:
  # ── Free PostgreSQL (expires after 90 days!) ──────────
  # For long-term free DB, use Neon or Supabase instead
  # and set the DATABASE_URL env var manually.
