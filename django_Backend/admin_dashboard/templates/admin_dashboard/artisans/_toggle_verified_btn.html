<!-- HTMX partial: Toggle verified button for artisan -->
{% if profile.is_verified %}
<form method="post" action="{% url 'admin_dashboard:artisan_toggle_verified' profile.pk %}"
      hx-post="{% url 'admin_dashboard:artisan_toggle_verified' profile.pk %}"
      hx-target="#verified-btn-{{ profile.pk }}"
      hx-swap="innerHTML"
      hx-confirm="Remove verification from {{ profile.user.username }}?"
      class="inline">
    {% csrf_token %}
    <button type="submit"
            class="px-4 py-2 border border-yellow-500 text-yellow-700 rounded-lg text-sm font-medium hover:bg-yellow-50 transition-colors cursor-pointer">
        <i class="bi bi-patch-minus mr-1"></i>Unverify
    </button>
</form>
{% else %}
<form method="post" action="{% url 'admin_dashboard:artisan_toggle_verified' profile.pk %}"
      hx-post="{% url 'admin_dashboard:artisan_toggle_verified' profile.pk %}"
      hx-target="#verified-btn-{{ profile.pk }}"
      hx-swap="innerHTML"
      hx-confirm="Verify {{ profile.user.username }}?"
      class="inline">
    {% csrf_token %}
    <button type="submit"
            class="px-4 py-2 bg-brand hover:bg-brand-dark text-white rounded-lg text-sm font-medium transition-colors cursor-pointer">
        <i class="bi bi-patch-check mr-1"></i>Verify
    </button>
</form>
{% endif %}
