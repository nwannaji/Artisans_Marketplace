<!-- HTMX partial: Single chat message bubble -->
<div class="text-right">
    <div class="inline-block max-w-[70%] px-4 py-2.5 rounded-2xl bg-brand text-white rounded-br-sm">
        <div class="text-xs text-white/70 mb-0.5"><i class="bi bi-shield-check mr-1"></i>Admin · {{ msg.sender.username }}</div>
        <div class="text-sm">{{ msg.message }}</div>
        <div class="text-xs text-white/60 mt-0.5">{{ msg.timestamp|date:"h:i A" }}</div>
    </div>
</div>
