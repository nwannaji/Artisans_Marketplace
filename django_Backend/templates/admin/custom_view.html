{% extends "admin/base_site.html" %}

{% block content %}
<div class="app-artisan module">
    <h2>Platform Overview</h2>
    <div class="dashboard-stats">
        <div class="stat-card">
            <h3>Total Users</h3>
            <p>{{ user_count }}</p>
        </div>
        <div class="stat-card">
            <h3>Active Artisans</h3>
            <p>{{ artisan_count }}</p>
        </div>
        <div class="stat-card">
            <h3>Pending Withdrawals</h3>
            <p>{{ withdrawal_count }}</p>
        </div>
        <div class="stat-card">
            <h3>Open Disputes</h3>
            <p>{{ dispute_count }}</p>
        </div>
    </div>
</div>

<style>
.dashboard-stats {
    display: flex;
    gap: 20px;
    margin: 20px 0;
}
.stat-card {
    background: #f8f8f8;
    padding: 20px;
    border-radius: 5px;
    flex: 1;
    text-align: center;
}
.stat-card h3 {
    margin-top: 0;
    color: #666;
}
.stat-card p {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 0;
}
</style>
{% endblock %}
